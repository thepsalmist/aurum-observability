apiVersion: 1

datasources:
  - name: Aurum Postgres
    uid: aurum-postgres
    type: postgres
    access: proxy
    url: ${POSTGRES_HOST}:${POSTGRES_PORT}
    database: ${POSTGRES_DB}
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      sslmode: ${POSTGRES_SSLMODE}
      postgresVersion: 1600
      timescaledb: false
    editable: false
