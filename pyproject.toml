[project]
name = "aurum-observability"
version = "0.1.0"
description = "Public observability stack for MT5 FX telemetry, analytics dashboards, and backtest artifacts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "boto3>=1.34",
    "fastapi>=0.115",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.4",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "moto[s3]>=5.0",
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
